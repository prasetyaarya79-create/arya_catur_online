<!DOCTYPE html>
<html>
<head>
    <title>Catur Online Multiplayer</title>
    <!-- CSS Chessboard -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; background: #0b1120; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        #myBoard { width: 400px; margin: 20px 0; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        input, button { padding: 8px 12px; border-radius: 4px; border: none; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Catur Online Real-Time</h2>
    <div class="controls">
        <input type="text" id="roomId" placeholder="Masukkan ID Room (misal: 123)">
        <button onclick="joinRoom()">Gabung Room</button>
    </div>
    <div id="status">Status: Belum terhubung</div>
    <div id="myBoard"></div>

    <!-- Script Libraries -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const socket = io("http://localhost:5000"); // Ganti URL ke server Render saat online
        let board = null;
        let game = new Chess();
        let myColor = null;
        let currentRoom = null;

        function joinRoom() {
            currentRoom = document.getElementById('roomId').value;
            if (!currentRoom) return alert("Isi ID Room!");
            socket.emit('join_game', { room: currentRoom });
        }

        socket.on('player_assigned', (data) => {
            myColor = data.color;
            document.getElementById('status').innerText = `Anda bermain sebagai: ${myColor.toUpperCase()}`;
            board.orientation(myColor);
        });

        socket.on('opponent_move', (move) => {
            game.move(move);
            board.position(game.fen());
        });

        function onDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            // Cegah menggerakkan bidak lawan atau bidak yang bukan giliran warnanya
            if ((myColor === 'white' && piece.search(/^b/) !== -1) ||
                (myColor === 'black' && piece.search(/^w/) !== -1) ||
                (game.turn() === 'w' && myColor !== 'white') ||
                (game.turn() === 'b' && myColor !== 'black')) {
                return false;
            }
        }

        function onDrop(source, target) {
            let move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback'; // Langkah tidak legal

            // Kirim pergerakan ke lawan melalui WebSocket
            socket.emit('make_move', { room: currentRoom, from: source, to: target, promotion: 'q' });
        }

        board = Chessboard('myBoard', {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: () => board.position(game.fen())
        });
    </script>
</body>
</html>
